<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日语 N5 学习路线</title><link rel="stylesheet" href="assets/course.css"><style>.lessons{list-style:none;padding:0}.lessons li{background:var(--paper);border:1px solid #d8cdbd;border-left:5px solid var(--accent);padding:20px;margin:12px 0}.lessons a{color:var(--ink);font-weight:700;text-decoration:none}.lessons small{display:block;color:var(--muted);margin-top:4px}.back{color:var(--accent);text-decoration:none;font-weight:700}.mission{margin-top:28px}</style></head><body><main class="page"><a class="back" href="../../">← 所有课程</a><div class="kicker">日本語 N5 · Learning Path</div><h1>旅行交流与 N5 基础</h1><p class="lead">目标：完成赴日旅游中的问候、购物、点餐、问路和交通等基础交流，同时建立继续学习 N4/N3 的语音、文字、词汇和语法框架。</p><section><h2>互动课程</h2><ol class="lessons"><li><a href="lessons/0001-survival-phrase-and-diagnostic.html">01 · 旅行生存句与入门诊断</a><small>学会没听懂时请对方再说一次，并用 5 道题定位后续起点。</small></li></ol></section><section class="mission"><h2>学习方式</h2><div class="card"><p>每天约 20 分钟，以旅行任务为主线；使用主动回忆、间隔复习和即时反馈，不从零机械重学已经掌握的内容。</p></div></section><p class="source">学习目标见 <a href="MISSION.md">MISSION.md</a>，权威资料见 <a href="RESOURCES.md">RESOURCES.md</a>。</p></main></body></html>
